name: deploy

on:
  push:
    branches: [main]
    paths: [hadleys_hope.py]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke test
        run: |
          pip install numpy
          python3 hadleys_hope.py --headless 1440 | head -3
      - name: copy file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: hadleys_hope.py
          target: /opt/hadleys-hope/
      - name: restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: sudo systemctl restart hadleys-hope && sleep 3 && sudo systemctl is-active hadleys-hope
