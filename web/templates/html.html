<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hadley's Hope</title>
<link rel="stylesheet" href="/static/css/navigation.css">
<link rel="stylesheet" href="/static/css/map.css">
</head>
<body class="hh-full">
NAVHTML
<div id="map"><canvas id="c"></canvas>
  <div id="banner" data-i18n="connecting...">connecting...</div>
  <div id="layer-seg" role="group" aria-label="Map layer"><button data-layer="colony" aria-pressed="true" data-i18n="Colony">Colony</button><button data-layer="water" aria-pressed="false" data-i18n="Water">Water</button><button data-layer="power" aria-pressed="false" data-i18n="Power">Power</button><button data-layer="network" aria-pressed="false" data-i18n="Network">Network</button></div>
  <div id="legend"></div>
  <div id="map-hint" data-i18n="Click a sector">Click a sector</div>
  <div id="finished"></div>
  <div id="tip" style="position:absolute;display:none;background:rgba(23,26,33,.95);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:11px;pointer-events:none"></div>
</div>
<div id="side">
  <section class="card" id="focus">
    <div class="focus-head"><h1 id="focus-title">Hadley's Hope</h1><span id="focus-sub" class="dim"></span></div>
    <div class="kpi" id="kpi"></div>
    <button id="focus-clear" hidden data-i18n="Back to the whole colony">Back to the whole colony</button>
  </section>
  <details class="card" id="ops-box"><summary data-i18n="Operator actions">Operator actions</summary><div class="row ops">
    <button data-i="span" data-i18n="break span">break span</button><button data-i="pole" data-i18n="fell pole">fell pole</button><button data-i="xeno" data-i18n="xenomorphs">xenomorphs</button>
    <button data-i="storm" data-i18n="storm">storm</button><button data-i="trunk" data-i18n="cut trunk">cut trunk</button><button data-i="pump" data-i18n="pump trip">pump trip</button>
    <button data-i="marines" data-i18n="marines fire">marines fire</button><button data-i="scram" data-i18n="SCRAM">SCRAM</button><button data-i="road" data-i18n="break road">break road</button><button data-i="money" data-i18n="+50k cr">+50k cr</button><button data-i="mine" data-i18n="flood mine">flood mine</button><button data-i="sewer_pump" data-i18n="sewage pump">sewage pump</button><button data-i="leak" data-i18n="pipe leak">pipe leak</button>
  </div></details>
  <h2 data-i18n="Reactor and power">Reactor and power</h2>
  <div id="reactor" class="card"></div>
  <h2 data-i18n="Sectors">Sectors</h2>
  <table id="sectors"><thead><tr><th>#</th><th data-i18n="cr">cr</th><th data-i18n="kW">kW</th><th data-i18n="avg C">avg C</th><th data-i18n="min C">min C</th><th data-i18n="pwr">pwr</th><th data-i18n="water">water</th><th data-i18n="net">net</th><th data-i18n="UPS">UPS</th><th data-i18n="waste">waste</th><th data-i18n="san">san</th><th data-i18n="gate">gate</th><th data-i18n="road">road</th></tr></thead><tbody></tbody></table>
  <h2><span data-i18n="Open issues">Open issues</span> <span id="nissues" class="dim"></span></h2>
  <div id="issues" class="dim" style="font-size:11px;max-height:120px;overflow-y:auto"></div>
  <h2 data-i18n="Events">Events</h2>
  <div id="log"></div>
  <h2 data-i18n="Last monthly report">Last monthly report</h2>
  <pre id="report" data-i18n="no month closed yet">no month closed yet</pre>
</div>
<script src="/static/js/i18n.js"></script><script src="/static/js/pages/map.js"></script></body></html>
